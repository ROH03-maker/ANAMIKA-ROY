<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .logo-bg { fill: #000000; }
      .logo-gold { fill: none; stroke: #D4AF37; stroke-width: 2; stroke-miterlimit: 10; }
      .logo-gold-thin { fill: none; stroke: #D4AF37; stroke-width: 1.2; }
      .logo-gold-fill { fill: #D4AF37; }
      .text-ar {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', serif;
        font-weight: 300;
        fill: #FFFFFF;
      }
    </style>
    <!-- Dark and clean shadow effect -->
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background container for luxury dark circular backdrop -->
  <rect width="100%" height="100%" class="logo-bg" rx="100" />

  <g filter="url(#subtle-glow)">
    <!-- Ornate Main Circle (diameter ~320px) -->
    <circle cx="260" cy="250" r="150" class="logo-gold" />

    <!-- Outer braided/leaf curve on the right-hand side of the circle -->
    <path d="M 366 144 C 390 174 412 210 412 250 C 412 290 390 326 366 356" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="1 5" />
    <path d="M 363 141 C 388 172 415 210 415 250 C 415 290 388 328 363 359" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    
    <!-- Twisted braid accents along the right edge -->
    <path d="M 370 170 Q 380 185 375 200" class="logo-gold-thin" />
    <path d="M 385 210 Q 395 225 390 240" class="logo-gold-thin" />
    <path d="M 390 250 Q 400 265 395 280" class="logo-gold-thin" />
    <path d="M 380 290 Q 390 305 385 320" class="logo-gold-thin" />

    <!-- Bottom Dots of Varying Sizes -->
    <circle cx="260" cy="406" r="4" class="logo-gold-fill" />
    <circle cx="280" cy="404" r="3" class="logo-gold-fill" />
    <circle cx="300" cy="400" r="2" class="logo-gold-fill" />
    <circle cx="240" cy="404" r="3" class="logo-gold-fill" />
    <circle cx="220" cy="400" r="2" class="logo-gold-fill" />
    <circle cx="200" cy="394" r="1.5" class="logo-gold-fill" />
    <circle cx="320" cy="394" r="1.5" class="logo-gold-fill" />

    <!-- Top-Left dotted accent on outer perimeter -->
    <circle cx="180" cy="120" r="2" class="logo-gold-fill" />
    <circle cx="165" cy="133" r="1.8" class="logo-gold-fill" />
    <circle cx="152" cy="148" r="1.5" class="logo-gold-fill" />
    <circle cx="141" cy="165" r="1.2" class="logo-gold-fill" />
    <circle cx="132" cy="183" r="1" class="logo-gold-fill" />

    <!-- Beautiful Lotus/Flower branch details on the left side -->
    <!-- Main branch curve -->
    <path d="M 230 380 C 180 375 125 320 115 250 C 110 210 120 170 145 135" fill="none" stroke="#D4AF37" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Branch curls -->
    <path d="M 200 375 C 220 380 230 395 210 405 C 195 410 185 395 190 385" fill="none" stroke="#D4AF37" stroke-width="1.2" />

    <!-- Stylized Lotus/Lily pointing left (flower center around (100, 230)) -->
    <g transform="translate(102, 235) rotate(-35)">
      <!-- Main Lotus Stem -->
      <path d="M 0 30 C -5 15 -10 0 -12 -15" fill="none" stroke="#D4AF37" stroke-width="1.8" />
      
      <!-- Center Petal -->
      <path d="M -12 -15 C -12 -35 -2 -50 0 -60 C 2 -50 12 -35 12 -15 C 12 5 0 10 -12 -15 Z" fill="#000000" stroke="#D4AF37" stroke-width="1.8" />
      
      <!-- Left Petal -->
      <path d="M -12 -15 C -25 -25 -32 -40 -35 -48 C -22 -44 -12 -35 -12 -15" fill="#000000" stroke="#D4AF37" stroke-width="1.8" />
      
      <!-- Right Petal -->
      <path d="M -12 -15 C 5 -25 15 -42 22 -48 C 15 -40 2 -32 -12 -15" fill="#000000" stroke="#D4AF37" stroke-width="1.8" />
      
      <!-- Small outer petals -->
      <path d="M -12 -15 C -30 -10 -40 -20 -44 -28 C -30 -24 -20 -20 -12 -15" fill="none" stroke="#D4AF37" stroke-width="1.2" />
      <path d="M -12 -15 C 10 -10 25 -22 30 -28 C 20 -24 5 -18 -12 -15" fill="none" stroke="#D4AF37" stroke-width="1.2" />

      <!-- Little base cup -->
      <path d="M -18 -10 C -15 -2 -5 0 0 -1 C 5 -2 8 -8 -18 -10 Z" fill="#D4AF37" />
    </g>

    <!-- Additional delicate leaves & flower buds -->
    <!-- Leaf 1 (Top side of branch) -->
    <path d="M 126 180 C 115 160 100 155 90 160 C 102 170 115 178 126 180" fill="#D4AF37" stroke="#D4AF37" stroke-width="1" />
    <path d="M 126 180 C 130 162 135 155 145 158 C 138 168 131 176 126 180" fill="none" stroke="#D4AF37" stroke-dasharray="1 1" />
    
    <!-- Leaf 2 (Bottom side of branch) -->
    <path d="M 135 315 C 110 325 95 335 105 348 C 115 340 128 328 135 315" fill="#D4AF37" stroke="#D4AF37" stroke-width="1" />

    <!-- Tiny decorative buds/sprigs near flower base -->
    <path d="M 112 280 Q 95 285 85 275" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="85" cy="275" r="3" class="logo-gold-fill" />
    <path d="M 110 290 Q 92 302 82 295" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="82" cy="295" r="2.5" class="logo-gold-fill" />

    <path d="M 120 200 Q 100 195 90 202" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="90" cy="202" r="2.5" class="logo-gold-fill" />
    <path d="M 122 190 Q 105 180 102 170" fill="none" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="102" cy="170" r="2" class="logo-gold-fill" />

    <!-- Artistic overlap Monogram: A and R -->
    <!-- Using clean vector path coordinates for a bespoke, extremely high-end, customized typographic monogram -->
    <g transform="translate(150, 140)">
      <!-- Let's draw the Letter 'A' (scaled beautifully) -->
      <!-- 'A' Left leg with the sweeping loop at the bottom left -->
      <!-- In the image: The left leg of 'A' sweeps in a generous, elegant circular curl at the bottom -->
      <path d="M 84 175 C 65 175 40 160 35 130 C 30 100 50 82 75 80 C 100 78 115 95 110 115 C 105 135 85 145 70 135 C 60 128 62 112 75 110 C 85 110 93 118 90 126 C 88 130 80 132 78 128" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Main A-frame lines -->
      <!-- Right leg of 'A' -->
      <path d="M 110 93 L 155 180" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <!-- Left main diagonal of 'A' -->
      <path d="M 110 93 L 78 152" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
      
      <!-- Elegant horizontal crossbar overlay sweeping outwards -->
      <path d="M 85 135 C 105 133 125 138 135 148" fill="none" stroke="#FFFFFF" stroke-width="2.5" />

      <!-- Let's draw the Letter 'R' (positioned gracefully next to A) -->
      <!-- Vertical backbone of 'R', which merges slightly/coexists closely with the right side of A -->
      <path d="M 160 98 L 160 180" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-linejoin="round" />
      
      <!-- The round bowl of 'R' -->
      <path d="M 160 98 L 185 98 C 215 98 215 135 185 135 L 160 135" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- The leg of 'R' with a graceful outward & downward sweep -->
      <path d="M 175 135 C 185 135 195 150 212 173 C 218 181 228 185 238 185" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

      <!-- Little top serif accents -->
      <!-- A serif on top of 'A' vertex -->
      <path d="M 103 93 L 117 93" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
      <!-- Serif on top of 'R' backbone -->
      <path d="M 152 98 L 168 98" stroke="#FFFFFF" stroke-width="3" fill="none" />
      <!-- Serif at base of 'R' leg -->
      <path d="M 152 180 L 168 180" stroke="#FFFFFF" stroke-width="3" fill="none" />
    </g>
  </g>
</svg>
